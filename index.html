<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quetzalcóatl Divino - Fotorrealista</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050811;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .web-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 75vw;
            height: 75vh;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            padding: 40px;
            box-sizing: border-box;
            z-index: 1;
        }

        #quetzalCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
        }
    </style>
</head>
<body>

    <div class="web-content">
        <h1>Quetzalcóatl: La Serpiente Emplumada</h1>
        <p>Esta versión rediseña por completo la cabeza con un penacho ceremonial, mandíbula de serpiente mítica y un cuerpo texturizado con plumas de esmeralda y fuego.</p>
    </div>

    <canvas id="quetzalCanvas"></canvas>

    <script>
        const canvas = document.getElementById('quetzalCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const numPoints = 70;
        const points = [];
        let progress = 0;
        let speed = 0.001;

        for (let i = 0; i < numPoints; i++) {
            points.push({ x: window.innerWidth / 2, y: window.innerHeight / 2 });
        }

        function getPerimeterPoint(p) {
            let w = window.innerWidth;
            let h = window.innerHeight;
            let margin = 40;
            
            let perimeter = 2 * ((w - margin * 2) + (h - margin * 2));
            let currentDist = p * perimeter;

            let x = margin, y = margin;
            let topLen = w - margin * 2;
            let rightLen = h - margin * 2;
            let bottomLen = w - margin * 2;

            if (currentDist <= topLen) {
                x = margin + currentDist;
                y = margin;
            } else if (currentDist <= topLen + rightLen) {
                x = w - margin;
                y = margin + (currentDist - topLen);
            } else if (currentDist <= topLen + rightLen + bottomLen) {
                x = (w - margin) - (currentDist - topLen - rightLen);
                y = h - margin;
            } else {
                x = margin;
                y = (h - margin) - (currentDist - topLen - rightLen - bottomLen);
            }

            return { x, y };
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            progress += speed;
            if (progress > 1) progress = 0;

            let target = getPerimeterPoint(progress);
            points[0].x = target.x;
            points[0].y = target.y;

            let time = Date.now() * 0.006;

            for (let i = 1; i < numPoints; i++) {
                let prev = points[i - 1];
                let curr = points[i];

                let dx = prev.x - curr.x;
                let dy = prev.y - curr.y;
                let angle = Math.atan2(dy, dx);
                let dist = Math.hypot(dx, dy);
                let targetSpacing = 10;

                if (dist > targetSpacing) {
                    curr.x = prev.x - Math.cos(angle) * targetSpacing;
                    curr.y = prev.y - Math.sin(angle) * targetSpacing;
                }

                let wave = Math.sin(time - i * 0.12) * (4 * (1 - i / numPoints));
                curr.x += -Math.sin(angle) * wave;
                curr.y += Math.cos(angle) * wave;
            }

            // 1. Dibujar el cuerpo emplumado (Múltiples capas para dar textura rica de plumas y escamas)
            ctx.save();
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            // Sombra exterior / Aura mítica dorada-rojiza
            ctx.beginPath();
            for (let i = 0; i < points.length; i++) {
                let p = points[i];
                if (i === 0) ctx.moveTo(p.x, p.y);
                else ctx.lineTo(p.x, p.y);
            }
            let bodyGrad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            bodyGrad.addColorStop(0, '#004d26');   // Verde esmeralda oscuro
            bodyGrad.addColorStop(0.4, '#00b050'); // Verde brillante de quetzal
            bodyGrad.addColorStop(0.7, '#d4af37'); // Dorado ceremonial
            bodyGrad.addColorStop(1, '#cc2200');   // Rojo penacho

            ctx.strokeStyle = bodyGrad;
            ctx.lineWidth = 26;
            ctx.shadowColor = 'rgba(212, 175, 55, 0.7)';
            ctx.shadowBlur = 20;
            ctx.stroke();

            // Capa interna de textura (patrón de escamas/plumas simuladas con trazo secundario)
            ctx.strokeStyle = '#00ff88';
            ctx.lineWidth = 12;
            ctx.shadowBlur = 5;
            ctx.stroke();
            ctx.restore();

            // 2. Dibujar la Cabeza de Quetzalcóatl Detallada
            let head = points[0];
            let nextPoint = points[2]; // Usar un punto más atrás para calcular el ángulo con estabilidad
            let headAngle = Math.atan2(head.y - nextPoint.y, head.x - nextPoint.x);

            ctx.save();
            ctx.translate(head.x, head.y);
            ctx.rotate(headAngle);

            // --- Penacho de Plumas Sagradas (Detrás de la cabeza) ---
            ctx.fillStyle = '#ff2200'; // Rojo vibrante de plumas
            ctx.beginPath();
            ctx.moveTo(-10, -5);
            ctx.lineTo(-35, -25);
            ctx.lineTo(-20, -5);
            ctx.lineTo(-40, 0);
            ctx.lineTo(-20, 5);
            ctx.lineTo(-35, 25);
            ctx.lineTo(-10, 5);
            ctx.fill();

            // Plumas doradas secundarias en el penacho
            ctx.fillStyle = '#ffd700';
            ctx.beginPath();
            ctx.moveTo(-15, -2);
            ctx.lineTo(-28, -12);
            ctx.lineTo(-15, 0);
            ctx.lineTo(-28, 12);
            ctx.lineTo(-15, 2);
            ctx.fill();

            // --- Hocico y Mandíbula de la Serpiente ---
            ctx.fillStyle = '#003311'; // Verde profundo escamoso
            ctx.strokeStyle = '#ffd700'; // Ribete dorado azteca
            ctx.lineWidth = 2.5;

            ctx.beginPath();
            // Forma de cabeza de serpiente estilizada (alargada y altiva)
            ctx.moveTo(25, 0); // Hocico
            ctx.lineTo(10, -12); // Arriba de la cabeza
            ctx.lineTo(-15, -10);
            ctx.lineTo(-20, 0); // Base del cuello
            ctx.lineTo(-15, 10);
            ctx.lineTo(10, 12);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // --- Detalles Faciales (Ojos místico-dorados y marcas ceremoniales) ---
            // Ojo brillante con pupila felina/reptiliana
            ctx.fillStyle = '#ffcc00';
            ctx.beginPath();
            ctx.ellipse(8, -4, 4, 2.5, Math.PI / 6, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.ellipse(8, -4, 1.5, 2.5, 0, 0, Math.PI * 2);
            ctx.fill();

            // Cresta o detalle dorado superior en el hocico
            ctx.strokeStyle = '#ff4500';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(15, -6);
            ctx.lineTo(5, -9);
            ctx.stroke();

            ctx.restore();

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
