<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trámites SARE</title>
<style>
  :root{
    --azul:#0b5fa5; --azul-osc:#093f6e; --gris:#f4f6f8; --borde:#d6dde3;
    --texto:#1f2a33; --rojo:#c0392b; --verde:#1e8449; --blanco:#ffffff;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:"Segoe UI",Arial,sans-serif; background:var(--gris); color:var(--texto);
  }
  header{
    background:linear-gradient(90deg,var(--azul-osc),var(--azul)); color:#fff;
    padding:18px 24px;
  }
  header h1{margin:0; font-size:20px;}
  .tabs{
    display:flex; background:var(--blanco); border-bottom:2px solid var(--borde);
  }
  .tab-btn{
    flex:1; padding:14px; text-align:center; cursor:pointer; font-weight:600;
    color:#5a6b78; border-bottom:3px solid transparent; user-select:none;
  }
  .tab-btn.activo{ color:var(--azul); border-bottom:3px solid var(--azul); }
  .contenedor{ max-width:900px; margin:20px auto; padding:0 16px 60px; }
  .modulo{ display:none; }
  .modulo.activo{ display:block; }
  .card{
    background:#fff; border:1px solid var(--borde); border-radius:10px;
    padding:20px; margin-bottom:18px;
  }
  .card h2{ margin-top:0; font-size:16px; color:var(--azul-osc); border-bottom:1px solid var(--borde); padding-bottom:8px;}
  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media(max-width:640px){ .grid{ grid-template-columns:1fr; } }
  .campo{ display:flex; flex-direction:column; gap:4px; }
  .campo label{ font-size:13px; font-weight:600; color:#3a4652; }
  .campo small{ color:#8091a0; font-weight:400; }
  input, select{
    padding:9px 10px; border:1px solid var(--borde); border-radius:6px; font-size:14px;
    background:#fff; color:var(--texto);
  }
  input:focus, select:focus{ outline:2px solid var(--azul); border-color:var(--azul);}
  .full{ grid-column:1 / -1; }
  .btn{
    background:var(--azul); color:#fff; border:none; padding:11px 20px; border-radius:6px;
    font-weight:600; cursor:pointer; font-size:14px;
  }
  .btn:hover{ background:var(--azul-osc); }
  .btn.secundario{ background:#6c7a89; }
  .btn.secundario:hover{ background:#54606c; }
  .acciones{ display:flex; gap:10px; margin-top:6px; }
  .mensaje{ padding:10px 14px; border-radius:6px; font-size:14px; margin-bottom:14px; display:none;}
  .mensaje.ok{ background:#eafaf1; color:var(--verde); border:1px solid #b7e8cb; display:block;}
  .mensaje.error{ background:#fdecea; color:var(--rojo); border:1px solid #f5c1ba; display:block;}
  .resultado-item{
    padding:10px; border:1px solid var(--borde); border-radius:6px; margin-bottom:8px;
    cursor:pointer; display:flex; justify-content:space-between; align-items:center;
  }
  .resultado-item:hover{ background:#f0f6fb; border-color:var(--azul); }
  .tag{ font-size:11px; background:var(--azul); color:#fff; padding:3px 8px; border-radius:12px; }
  .oculto{ display:none !important; }
  .loading{ font-size:13px; color:#8091a0; }
</style>
</head>
<body>

<header>
  <h1>Trámites SARE — Cambios y Bajas</h1>
</header>

<div class="tabs">
  <div class="tab-btn activo" data-modulo="modulo-captura">1. Registrar Trámite</div>
  <div class="tab-btn" data-modulo="modulo-edicion">2. Buscar / Editar Trámite</div>
</div>

<div class="contenedor">

  <!-- =============================================================================
       MODULO 1: CAPTURA DE NUEVO TRAMITE
  ============================================================================== -->
  <div id="modulo-captura" class="modulo activo">
    <div id="msg-captura" class="mensaje"></div>

    <div class="card">
      <h2>Responsable y Ficha</h2>
      <div class="grid" id="bloque-comun"></div>
    </div>

    <div class="card">
      <h2>Datos del Solicitante</h2>
      <div class="grid" id="bloque-solicitante"></div>
    </div>

    <div class="card">
      <h2>Tipo de Trámite</h2>
      <div class="campo full">
        <label>Selecciona el trámite</label>
        <select id="select-tramite">
          <option value="">-- Selecciona una opción --</option>
          <option value="CUT">CUT (Cambio de Ubicación de Tarjeta)</option>
          <option value="RVP">RVP (Renuncia Voluntaria al Programa)</option>
          <option value="RDC">RDC (Reimpresión o Duplicado de Contrato Bancario)</option>
          <option value="RDT">RDT (Reposición de Tarjeta - Robo o Extravío)</option>
          <option value="CDT">CDT (Cambio de Tutor)</option>
          <option value="BDI">BDI (Baja de Integrante/Registro)</option>
        </select>
      </div>
    </div>

    <div id="bloque-folio-unico" class="card oculto">
      <h2>Folio Único</h2>
      <div class="campo full">
        <label>Folio disponible</label>
        <select id="select-folio-unico"><option value="">Cargando folios...</option></select>
      </div>
    </div>

    <div id="bloque-dinamico"></div>

    <div class="acciones">
      <button class="btn" id="btn-guardar-captura">Guardar Trámite</button>
      <button class="btn secundario" id="btn-limpiar-captura" type="button">Limpiar</button>
    </div>
  </div>

  <!-- =============================================================================
       MODULO 2: EDICION / BUSQUEDA DE TRAMITES
  ============================================================================== -->
  <div id="modulo-edicion" class="modulo">
    <div id="msg-edicion" class="mensaje"></div>

    <div class="card">
      <h2>Buscar Trámite</h2>
      <div class="grid">
        <div class="campo">
          <label>Buscar por</label>
          <select id="select-buscar-por">
            <option value="folio">Folio</option>
            <option value="curp">CURP del Solicitante</option>
          </select>
        </div>
        <div class="campo">
          <label>Valor a buscar</label>
          <input type="text" id="input-buscar-valor" placeholder="Escribe el folio o CURP">
        </div>
      </div>
      <div class="acciones"><button class="btn" id="btn-buscar">Buscar</button></div>
    </div>

    <div class="card oculto" id="card-resultados">
      <h2>Resultados</h2>
      <div id="lista-resultados"></div>
    </div>

    <div id="form-edicion-wrapper" class="oculto">
      <div class="card">
        <h2>Responsable y Ficha</h2>
        <div class="grid" id="bloque-comun-edit"></div>
      </div>
      <div class="card">
        <h2>Datos del Solicitante</h2>
        <div class="grid" id="bloque-solicitante-edit"></div>
      </div>
      <div id="bloque-folio-unico-edit" class="card oculto">
        <h2>Folio Único</h2>
        <div class="campo full">
          <label>Folio Único registrado</label>
          <input type="text" id="input-folio-unico-edit" readonly>
        </div>
      </div>
      <div id="bloque-dinamico-edit"></div>
      <div class="acciones">
        <button class="btn" id="btn-guardar-edicion">Actualizar Trámite</button>
      </div>
    </div>
  </div>

</div>

<script>
/* =======================================================================================
   MODULO: CONFIGURACION GENERAL
   -----------------------------------------------------------------------------------
   Aquí se define la URL del Apps Script (backend) conectado al libro de Google Sheets.
   Esta URL NO se pide al usuario en pantalla: se configura directamente en este código,
   tal como se solicitó. Debe ser la URL de "Implementación > Aplicación web" del script
   Code.gs (termina en /exec).
======================================================================================= */
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyUAMDWhiY2Gy3h8hfhOz_8-kbT7VNGg6MZloQL5l12LAdvokm4dUzVVgx4ff4bVHbt/exec";

/* =======================================================================================
   MODULO: CONFIG.columns
   -----------------------------------------------------------------------------------
   Mapeo de campos -> columna en la hoja TRAMITES. Debe coincidir EXACTAMENTE con el
   objeto COL del archivo Code.gs. Si necesitas mover una columna, cámbiala aquí Y allá.
======================================================================================= */
const CONFIG = {
  comunes: [
    { id:'responsable', label:'Responsable de Atención SARE', col:'A', tipo:'text' },
    { id:'estatus_ficha', label:'Estatus de Ficha', col:'C', tipo:'select',
      opciones:[
        {v:'U', t:'U = Utilizada'}, {v:'FB', t:'FB = Formato en Blanco'},
        {v:'D', t:'D = Dañada'}, {v:'C', t:'C = Cancelada'}, {v:'E', t:'E = Extraviada'}
      ]},
    { id:'cupo_elabora', label:'Cupo de quien elabora', col:'D', tipo:'text' },
    { id:'fecha_elaboracion', label:'Fecha de Elaboración', col:'E', tipo:'date' }
  ],
  solicitante: [
    { id:'id_familia', label:'ID Familia Solicitante', col:'F', tipo:'text' },
    { id:'nombre_sol', label:'Nombre Solicitante', col:'G', tipo:'text' },
    { id:'apellido1_sol', label:'Primer Apellido Solicitante', col:'H', tipo:'text' },
    { id:'apellido2_sol', label:'Segundo Apellido Solicitante', col:'I', tipo:'text' },
    { id:'curp_sol', label:'CURP (18 dígitos) Solicitante', col:'J', tipo:'text', maxlength:18 },
    { id:'telefono_sol', label:'Núm. de Teléfono (10 dígitos) Solicitante', col:'K', tipo:'text', maxlength:10 },
    { id:'correo_sol', label:'Correo Electrónico Solicitante', col:'L', tipo:'email' }
  ],
  
  folioUnico: { col:'B' }, // Se usa solo para RDC y RDT
  tramites: {
    CUT: {
      nombre: 'CUT (Cambio de Ubicación de Tarjeta)',
      colSeleccion: 'M',
      valorSeleccion: 'CUT (CAMBIO DE UBICACION DE TARJETA)',
      usaFolioUnico:false,
      campos:[
        { id:'cut_clave_estado', label:'Clave del Estado', col:'N', tipo:'text' },
        { id:'cut_nombre_estado', label:'Nombre del Estado', col:'O', tipo:'text' },
        { id:'cut_sare_procedencia', label:'SARE de Procedencia', col:'P', tipo:'select',
          opciones:['1301','1302','1303','1304','1305','1306','1307'].map(v=>({v,t:v})) },
        { id:'cut_cct', label:'C.C.T. (10 dígitos)', col:'Q', tipo:'text', maxlength:10 },
        { id:'cut_nombre_escuela', label:'Nombre de la Escuela', col:'R', tipo:'text' },
        { id:'cut_programa', label:'Programa', col:'S', tipo:'select',
          opciones:[{v:'RC',t:'RC'},{v:'BUEMS',t:'BUEMS'},{v:'JEF',t:'JEF'}] }
      ]
    },
    RVP: {
      nombre: 'RVP (Renuncia Voluntaria al Programa)',
      colSeleccion: 'T',
      valorSeleccion: 'RVP=Renuncia Voluntaria al Programa',
      usaFolioUnico:false,
      campos:[
        { id:'rvp_motivo', label:'Motivo de la Renuncia', col:'U', tipo:'text' }
      ]
    },
    RDC: {
      nombre: 'RDC (Reimpresión o Duplicado de Contrato Bancario)',
      colSeleccion: 'V',
      valorSeleccion: 'RDC=Reimpresión o Duplicado de Contrato Bancario',
      usaFolioUnico:true,
      campos:[]
    },
    RDT: {
      nombre: 'RDT (Reposición de Tarjeta - Robo o Extravío)',
      colSeleccion: 'W',
      valorSeleccion: 'RDT=Reposicion de Tarjeta (Robo o Extravío)',
      usaFolioUnico:true,
      campos:[
        { id:'rdt_folio_banco', label:'Núm. de Folio del Reporte ante el Banco de Bienestar', col:'X', tipo:'text' }
      ]
    },
    CDT: {
      nombre: 'CDT (Cambio de Tutor)',
      colSeleccion: 'Y',
      valorSeleccion: 'CDT=Cambio de Tutor',
      usaFolioUnico:false,
      campos:[
        { id:'cdt_causal', label:'Causal del Cambio de Tutor', col:'Z', tipo:'text' },
        { id:'cdt_nombre', label:'Nombre', col:'AA', tipo:'text' },
        { id:'cdt_apellido1', label:'Primer Apellido', col:'AB', tipo:'text' },
        { id:'cdt_apellido2', label:'Segundo Apellido', col:'AC', tipo:'text' },
        { id:'cdt_curp', label:'CURP (18 dígitos) Integrante-Baja', col:'AD', tipo:'text', maxlength:18 },
        { id:'cdt_fecha_validacion', label:'Fecha de Validación', col:'AK', tipo:'date' },
        { id:'cdt_folio_sibueb', label:'Folio SIBUEB o Formulario', col:'AL', tipo:'text' }
      ]
    },
    BDI: {
      nombre: 'BDI (Baja de Integrante/Registro)',
      colSeleccion: 'AE',
      valorSeleccion: 'BDI=Baja de Integrante/Registro',
      usaFolioUnico:false,
      campos:[
        { id:'bdi_id_integrante', label:'ID Integrante (de quien se solicita la baja)', col:'AF', tipo:'text' },
        { id:'bdi_nombre', label:'Nombre Integrante-Baja', col:'AG', tipo:'text' },
        { id:'bdi_apellido1', label:'Primer Apellido Integrante-Baja', col:'AH', tipo:'text' },
        { id:'bdi_apellido2', label:'Segundo Apellido Integrante-Baja', col:'AI', tipo:'text' },
        { id:'bdi_curp', label:'CURP (18 dígitos) Integrante-Baja', col:'AJ', tipo:'text', maxlength:18 },
        { id:'bdi_fecha_validacion', label:'Fecha de Validación', col:'AK', tipo:'date' },
        { id:'bdi_folio_sibueb', label:'Folio SIBUEB', col:'AL', tipo:'text' }
      ]
    }
  }
};

/* =======================================================================================
   MODULO: UTILIDADES (validaciones y helpers de formulario)
======================================================================================= */
const Utils = {
  soloDigitos(input, maxLen){
    input.addEventListener('input', () => {
      input.value = input.value.replace(/\D/g,'').slice(0, maxLen);
    });
  },

  // Permite letras y números, eliminando símbolos y convirtiendo a mayúsculas
  soloAlfanumerico(input, maxLen){
    input.addEventListener('input', () => {
      input.value = input.value.replace(/[^a-zA-Z0-9]/g, '').toUpperCase().slice(0, maxLen);
    });
  },

  crearCampoHTML(campo, idPrefix, valor){
    const wrapperFull = campo.tipo === 'select' || campo.id.includes('nombre') ? '' : '';
    const div = document.createElement('div');
    div.className = 'campo';
    const label = document.createElement('label');
    label.textContent = campo.label;
    div.appendChild(label);

    let input;
    if (campo.tipo === 'select') {
      input = document.createElement('select');
      const optVacia = document.createElement('option');
      optVacia.value = ''; optVacia.textContent = '-- Selecciona --';
      input.appendChild(optVacia);
      campo.opciones.forEach(op => {
        const o = document.createElement('option');
        o.value = op.v; o.textContent = op.t;
        input.appendChild(o);
      });
    } else {
      input = document.createElement('input');
      input.type = campo.tipo === 'date' ? 'date' : (campo.tipo === 'email' ? 'email' : 'text');
      
      if (campo.maxlength) {
        input.maxLength = campo.maxlength;
        
        // Aplica alfanumérico si es CURP, o solo dígitos si es teléfono/numérico
        if (campo.id.includes('curp')) {
          Utils.soloAlfanumerico(input, campo.maxlength);
        } else if (campo.id.includes('telefono') || campo.tipo === 'number') {
          Utils.soloDigitos(input, campo.maxlength);
        }
      }
    }
    input.id = idPrefix + campo.id;
    input.dataset.col = campo.col;
    if (valor !== undefined && valor !== null) input.value = valor;
    div.appendChild(input);
    return div;
  },

  mostrarMensaje(elId, texto, tipo){
    const el = document.getElementById(elId);
    el.textContent = texto;
    el.className = 'mensaje ' + tipo;
    setTimeout(()=>{ el.className='mensaje'; }, 6000);
  }
};
/* =======================================================================================
   MODULO: DataService (comunicación con el backend Apps Script)
======================================================================================= */
const DataService = {
  async getFoliosDisponibles(){
    const res = await fetch(`${APPS_SCRIPT_URL}?action=folios`);
    return res.json();
  },
  async buscarTramites(por, valor){
    const url = `${APPS_SCRIPT_URL}?action=search&by=${encodeURIComponent(por)}&q=${encodeURIComponent(valor)}`;
    const res = await fetch(url);
    return res.json();
  },
  async crearTramite(data){
    const res = await fetch(APPS_SCRIPT_URL, {
      method:'POST',
      body: JSON.stringify({ action:'create', data })
      // Sin header Content-Type a propósito: evita el preflight CORS con Apps Script.
    });
    return res.json();
  },
  async actualizarTramite(rowIndex, data){
    const res = await fetch(APPS_SCRIPT_URL, {
      method:'POST',
      body: JSON.stringify({ action:'update', rowIndex, data })
    });
    return res.json();
  }
};

/* =======================================================================================
   MODULO: TABS (cambio entre Módulo 1 y Módulo 2)
======================================================================================= */
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('activo'));
    document.querySelectorAll('.modulo').forEach(m=>m.classList.remove('activo'));
    btn.classList.add('activo');
    document.getElementById(btn.dataset.modulo).classList.add('activo');
  });
});

/* =======================================================================================
   MODULO: CAPTURA (Módulo 1)
======================================================================================= */
const Captura = {
  init(){
    const bloqueComun = document.getElementById('bloque-comun');
    CONFIG.comunes.forEach(c => bloqueComun.appendChild(Utils.crearCampoHTML(c, 'cap_')));

    const bloqueSolicitante = document.getElementById('bloque-solicitante');
    CONFIG.solicitante.forEach(c => bloqueSolicitante.appendChild(Utils.crearCampoHTML(c, 'cap_')));

    document.getElementById('select-tramite').addEventListener('change', (e)=>{
      Captura.renderTramite(e.target.value);
    });
    document.getElementById('btn-guardar-captura').addEventListener('click', Captura.guardar);
    document.getElementById('btn-limpiar-captura').addEventListener('click', ()=>location.reload());
  },

  async renderTramite(tipo){
    const bloqueDinamico = document.getElementById('bloque-dinamico');
    const bloqueFolio = document.getElementById('bloque-folio-unico');
    bloqueDinamico.innerHTML = '';
    bloqueFolio.classList.add('oculto');

    if (!tipo) return;
    const def = CONFIG.tramites[tipo];

    if (def.usaFolioUnico) {
      bloqueFolio.classList.remove('oculto');
      await Captura.cargarFoliosDisponibles();
    }

    const card = document.createElement('div');
    card.className = 'card';
    const h2 = document.createElement('h2');
    h2.textContent = def.nombre;
    card.appendChild(h2);
    const grid = document.createElement('div');
    grid.className = 'grid';
    def.campos.forEach(c => grid.appendChild(Utils.crearCampoHTML(c, 'cap_')));
    card.appendChild(grid);
    bloqueDinamico.appendChild(card);
  },

  async cargarFoliosDisponibles(){
    const select = document.getElementById('select-folio-unico');
    select.innerHTML = '<option value="">Cargando...</option>';
    try {
      const folios = await DataService.getFoliosDisponibles();
      select.innerHTML = '<option value="">-- Selecciona un folio --</option>';
      (folios || []).forEach(f=>{
        const op = document.createElement('option');
        op.value = f; op.textContent = f;
        select.appendChild(op);
      });
    } catch(err){
      select.innerHTML = '<option value="">Error al cargar folios</option>';
    }
  },

  recolectarDatos(){
    const data = {};
    // Campos comunes + solicitante
    document.querySelectorAll('#bloque-comun [data-col], #bloque-solicitante [data-col]').forEach(el=>{
      data[el.dataset.col] = el.value;
    });

    const tipo = document.getElementById('select-tramite').value;
    if (!tipo) return { error: 'Selecciona un tipo de trámite.' };
    const def = CONFIG.tramites[tipo];

    // Columna de selección del tramite
    data[def.colSeleccion] = def.valorSeleccion;

    // Folio único (si aplica)
    if (def.usaFolioUnico) {
      const folio = document.getElementById('select-folio-unico').value;
      if (!folio) return { error: 'Selecciona el Folio Único.' };
      data[CONFIG.folioUnico.col] = folio;
    }

    // Campos dinámicos del tramite
    document.querySelectorAll('#bloque-dinamico [data-col]').forEach(el=>{
      data[el.dataset.col] = el.value;
    });

    return { data, tipo };
  },

  async guardar(){
    const resultado = Captura.recolectarDatos();
    if (resultado.error) {
      Utils.mostrarMensaje('msg-captura', resultado.error, 'error');
      return;
    }
    try {
      const respuesta = await DataService.crearTramite(resultado.data);
      if (respuesta.error) throw new Error(respuesta.error);
      Utils.mostrarMensaje('msg-captura', 'Trámite guardado correctamente (fila ' + respuesta.rowIndex + ').', 'ok');
    } catch(err){
      Utils.mostrarMensaje('msg-captura', 'Error al guardar: ' + err.message, 'error');
    }
  }
};

/* =======================================================================================
   MODULO: EDICION (Módulo 2)
======================================================================================= */
const Edicion = {
  rowIndexActual: null,
  tipoActual: null,

  init(){
    document.getElementById('btn-buscar').addEventListener('click', Edicion.buscar);
    document.getElementById('btn-guardar-edicion').addEventListener('click', Edicion.actualizar);
  },

  async buscar(){
    const por = document.getElementById('select-buscar-por').value;
    const valor = document.getElementById('input-buscar-valor').value.trim();
    if (!valor) {
      Utils.mostrarMensaje('msg-edicion', 'Escribe un valor para buscar.', 'error');
      return;
    }
    document.getElementById('card-resultados').classList.add('oculto');
    document.getElementById('form-edicion-wrapper').classList.add('oculto');

    try {
      const resultados = await DataService.buscarTramites(por, valor);
      if (resultados.error) throw new Error(resultados.error);
      if (!resultados.length) {
        Utils.mostrarMensaje('msg-edicion', 'No se encontraron registros.', 'error');
        return;
      }
      Edicion.mostrarResultados(resultados);
    } catch(err){
      Utils.mostrarMensaje('msg-edicion', 'Error al buscar: ' + err.message, 'error');
    }
  },

  mostrarResultados(resultados){
    const cont = document.getElementById('lista-resultados');
    cont.innerHTML = '';
    resultados.forEach(r=>{
      const div = document.createElement('div');
      div.className = 'resultado-item';
      const nombre = r.valores['G'] + ' ' + r.valores['H'] + ' ' + r.valores['I'];
      div.innerHTML = `<span>Fila ${r.rowIndex} — ${nombre} — CURP: ${r.valores['J']}</span><span class="tag">${r.tipo || 'N/D'}</span>`;
      div.addEventListener('click', ()=> Edicion.cargarFormulario(r));
      cont.appendChild(div);
    });
    document.getElementById('card-resultados').classList.remove('oculto');
  },

  cargarFormulario(registro){
    Edicion.rowIndexActual = registro.rowIndex;
    Edicion.tipoActual = registro.tipo;
    const valores = registro.valores;

    const bloqueComun = document.getElementById('bloque-comun-edit');
    bloqueComun.innerHTML = '';
    CONFIG.comunes.forEach(c => bloqueComun.appendChild(Utils.crearCampoHTML(c, 'edit_', valores[c.col])));

    const bloqueSolicitante = document.getElementById('bloque-solicitante-edit');
    bloqueSolicitante.innerHTML = '';
    CONFIG.solicitante.forEach(c => bloqueSolicitante.appendChild(Utils.crearCampoHTML(c, 'edit_', valores[c.col])));

    const bloqueFolio = document.getElementById('bloque-folio-unico-edit');
    const def = registro.tipo ? CONFIG.tramites[registro.tipo] : null;
    if (def && def.usaFolioUnico) {
      bloqueFolio.classList.remove('oculto');
      document.getElementById('input-folio-unico-edit').value = valores[CONFIG.folioUnico.col] || '';
    } else {
      bloqueFolio.classList.add('oculto');
    }

    const bloqueDinamico = document.getElementById('bloque-dinamico-edit');
    bloqueDinamico.innerHTML = '';
    if (def) {
      const card = document.createElement('div');
      card.className = 'card';
      const h2 = document.createElement('h2');
      h2.textContent = def.nombre + ' (registrado)';
      card.appendChild(h2);
      const grid = document.createElement('div');
      grid.className = 'grid';
      def.campos.forEach(c => grid.appendChild(Utils.crearCampoHTML(c, 'edit_', valores[c.col])));
      card.appendChild(grid);
      bloqueDinamico.appendChild(card);
    }

    document.getElementById('form-edicion-wrapper').classList.remove('oculto');
  },

  async actualizar(){
    if (!Edicion.rowIndexActual) return;
    const data = {};
    document.querySelectorAll('#bloque-comun-edit [data-col], #bloque-solicitante-edit [data-col], #bloque-dinamico-edit [data-col]')
      .forEach(el=>{ data[el.dataset.col] = el.value; });

    try {
      const resp = await DataService.actualizarTramite(Edicion.rowIndexActual, data);
      if (resp.error) throw new Error(resp.error);
      Utils.mostrarMensaje('msg-edicion', 'Trámite actualizado correctamente.', 'ok');
    } catch(err){
      Utils.mostrarMensaje('msg-edicion', 'Error al actualizar: ' + err.message, 'error');
    }
  }
};

/* =======================================================================================
   MODULO: INICIALIZACION GENERAL
======================================================================================= */
Captura.init();
Edicion.init();
</script>
</body>
</html>
