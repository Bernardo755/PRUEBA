<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quetzalcóatl Realista - Canvas</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f111a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .web-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 75vw;
            height: 75vh;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            padding: 40px;
            box-sizing: border-box;
            z-index: 1;
        }

        /* El lienzo ocupa toda la pantalla pero permite clics a través de él */
        #quetzalCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
        }
    </style>
</head>
<body>

    <div class="web-content">
        <h1>Quetzalcóatl en Canvas</h1>
        <p>Esta versión utiliza un motor gráfico en tiempo real para lograr un cuerpo continuo, flexible y con texturas de plumas fluidas.</p>
    </div>

    <canvas id="quetzalCanvas"></canvas>

    <script>
        const canvas = document.getElementById('quetzalCanvas');
        const ctx = canvas.getContext('2d');

        // Ajustar resolución del canvas a pantallas Retina/HD
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Configuración de la serpiente
        const numPoints = 60; // Mayor cantidad de puntos para una curva ultra suave
        const points = [];
        let progress = 0;
        let speed = 0.0012;

        // Inicializar puntos en el centro
        for (let i = 0; i < numPoints; i++) {
            points.push({ x: window.innerWidth / 2, y: window.innerHeight / 2 });
        }

        // Función matemática del perímetro de la pantalla
        function getPerimeterPoint(p) {
            let w = window.innerWidth;
            let h = window.innerHeight;
            let margin = 40;
            
            let perimeter = 2 * ((w - margin * 2) + (h - margin * 2));
            let currentDist = p * perimeter;

            let x = margin, y = margin;
            let topLen = w - margin * 2;
            let rightLen = h - margin * 2;
            let bottomLen = w - margin * 2;

            if (currentDist <= topLen) {
                x = margin + currentDist;
                y = margin;
            } else if (currentDist <= topLen + rightLen) {
                x = w - margin;
                y = margin + (currentDist - topLen);
            } else if (currentDist <= topLen + rightLen + bottomLen) {
                x = (w - margin) - (currentDist - topLen - rightLen);
                y = h - margin;
            } else {
                x = margin;
                y = (h - margin) - (currentDist - topLen - rightLen - bottomLen);
            }

            return { x, y };
        }

        function animate() {
            // Limpiar canvas en cada fotograma
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Avanzar recorrido
            progress += speed;
            if (progress > 1) progress = 0;

            let target = getPerimeterPoint(progress);

            // Simulación física de arrastre (Inverse Kinematics / Follow-the-leader suave)
            points[0].x = target.x;
            points[0].y = target.y;

            // Añadir ondulación sinusoidal orgánica a lo largo del cuerpo
            let time = Date.now() * 0.005;

            for (let i = 1; i < numPoints; i++) {
                let prev = points[i - 1];
                let curr = points[i];

                // Inercia de seguimiento
                let dx = prev.x - curr.x;
                let dy = prev.y - curr.y;
                let angle = Math.atan2(dy, dx);
                
                let dist = Math.hypot(dx, dy);
                let targetSpacing = 12; // Distancia fija entre segmentos corporales

                if (dist > targetSpacing) {
                    curr.x = prev.x - Math.cos(angle) * targetSpacing;
                    curr.y = prev.y - Math.sin(angle) * targetSpacing;
                }

                // Ondulación lateral simulando el nado de una serpiente
                let wave = Math.sin(time - i * 0.15) * (3 * (1 - i / numPoints));
                curr.x += -Math.sin(angle) * wave;
                curr.y += Math.cos(angle) * wave;
            }

            // Dibujar el cuerpo del Quetzalcóatl como una cinta continua con grosor variable
            ctx.beginPath();
            for (let i = 0; i < points.length; i++) {
                let p = points[i];
                if (i === 0) {
                    ctx.moveTo(p.x, p.y);
                } else {
                    ctx.lineTo(p.x, p.y);
                }
            }

            // Estilo del trazo: Gradiente tornasolado (Verde esmeralda -> Dorado -> Penachos rojos)
            let gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            gradient.addColorStop(0, '#004d26');
            gradient.addColorStop(0.3, '#2e8b57');
            gradient.addColorStop(0.7, '#d4af37');
            gradient.addColorStop(1, '#8b0000');

            ctx.strokeStyle = gradient;
            ctx.lineWidth = 32; // Grosor máximo en la cabeza
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            // Sombra realista estilo brillo divino / aura
            ctx.shadowColor = 'rgba(212, 175, 55, 0.6)';
            ctx.shadowBlur = 15;
            ctx.stroke();

            // Dibujar la cabeza detallada en la punta (índice 0)
            let head = points[0];
            let nextPoint = points[1];
            let headAngle = Math.atan2(head.y - nextPoint.y, head.x - nextPoint.x);

            ctx.save();
            ctx.translate(head.x, head.y);
            ctx.rotate(headAngle);

            // Cabeza estilizada con Canvas (puedes reemplazar esto por una imagen `drawImage` si lo prefieres)
            ctx.fillStyle = '#002613';
            ctx.strokeStyle = '#ffd700';
            ctx.lineWidth = 3;
            
            ctx.beginPath();
            ctx.ellipse(0, 0, 22, 14, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Ojos brillantes
            ctx.fillStyle = '#ff4500';
            ctx.beginPath();
            ctx.arc(8, -5, 3, 0, Math.PI * 2);
            ctx.arc(8, 5, 3, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
