<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quetzalcóatl Realista Avanzado</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #03050a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .web-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 75vw;
            height: 75vh;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            padding: 40px;
            box-sizing: border-box;
            z-index: 1;
        }

        #quetzalCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
        }
    </style>
</head>
<body>

    <div class="web-content">
        <h1>Quetzalcóatl Orgánico</h1>
        <p>Esta versión utiliza un renderizado avanzado de plumas en capas, textura escamada y ojos con destellos de brillo divino que recorren de forma fluida el contorno.</p>
    </div>

    <canvas id="quetzalCanvas"></canvas>

    <script>
        const canvas = document.getElementById('quetzalCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const numPoints = 80;
        const points = [];
        let progress = 0;
        let speed = 0.0009;

        for (let i = 0; i < numPoints; i++) {
            points.push({ x: window.innerWidth / 2, y: window.innerHeight / 2 });
        }

        function getPerimeterPoint(p) {
            let w = window.innerWidth;
            let h = window.innerHeight;
            let margin = 30;
            
            let perimeter = 2 * ((w - margin * 2) + (h - margin * 2));
            let currentDist = p * perimeter;

            let x = margin, y = margin;
            let topLen = w - margin * 2;
            let rightLen = h - margin * 2;
            let bottomLen = w - margin * 2;

            if (currentDist <= topLen) {
                x = margin + currentDist;
                y = margin;
            } else if (currentDist <= topLen + rightLen) {
                x = w - margin;
                y = margin + (currentDist - topLen);
            } else if (currentDist <= topLen + rightLen + bottomLen) {
                x = (w - margin) - (currentDist - topLen - rightLen);
                y = h - margin;
            } else {
                x = margin;
                y = (h - margin) - (currentDist - topLen - rightLen - bottomLen);
            }

            return { x, y };
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            progress += speed;
            if (progress > 1) progress = 0;

            let target = getPerimeterPoint(progress);
            points[0].x = target.x;
            points[0].y = target.y;

            let time = Date.now() * 0.005;

            for (let i = 1; i < numPoints; i++) {
                let prev = points[i - 1];
                let curr = points[i];

                let dx = prev.x - curr.x;
                let dy = prev.y - curr.y;
                let angle = Math.atan2(dy, dx);
                let dist = Math.hypot(dx, dy);
                let targetSpacing = 9;

                if (dist > targetSpacing) {
                    curr.x = prev.x - Math.cos(angle) * targetSpacing;
                    curr.y = prev.y - Math.sin(angle) * targetSpacing;
                }

                let wave = Math.sin(time - i * 0.1) * (4.5 * (1 - i / numPoints));
                curr.x += -Math.sin(angle) * wave;
                curr.y += Math.cos(angle) * wave;
            }

            // Dibujar cuerpo segmentado imitando plumas y escamas superpuestas
            for (let i = points.length - 1; i > 0; i--) {
                let p = points[i];
                let ratio = 1 - (i / numPoints);
                let size = Math.max(4, 28 * ratio);

                ctx.save();
                ctx.translate(p.x, p.y);
                
                let nextP = points[i - 1] || p;
                let ang = Math.atan2(nextP.y - p.y, nextP.x - p.x);
                ctx.rotate(ang);

                // Base de escama/pluma con tono tornasolado variable
                ctx.beginPath();
                ctx.fillStyle = i % 2 === 0 ? '#004d26' : '#1b4d3e';
                if (i < 20) ctx.fillStyle = '#cc2200'; // Zona de penacho inicial en el lomo
                
                ctx.ellipse(0, 0, size, size * 0.7, 0, 0, Math.PI * 2);
                ctx.fill();

                // Brillo central simulando textura tridimensional de pluma de quetzal
                ctx.beginPath();
                ctx.fillStyle = '#00ff88';
                ctx.ellipse(0, 0, size * 0.6, size * 0.3, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }

            // Renderizado detallado de la cabeza mítica
            let head = points[0];
            let nextPoint = points[3];
            let headAngle = Math.atan2(head.y - nextPoint.y, head.x - nextPoint.x);

            ctx.save();
            ctx.translate(head.x, head.y);
            ctx.rotate(headAngle);

            // Penacho trasero frondoso de plumas divinas
            ctx.fillStyle = '#e60000';
            ctx.beginPath();
            ctx.moveTo(-5, 0);
            ctx.lineTo(-45, -20);
            ctx.lineTo(-25, -5);
            ctx.lineTo(-50, 0);
            ctx.lineTo(-25, 5);
            ctx.lineTo(-45, 20);
            ctx.closePath();
            ctx.fill();

            // Detalles dorados en el penacho
            ctx.fillStyle = '#ffd700';
            ctx.beginPath();
            ctx.moveTo(-10, 0);
            ctx.lineTo(-30, -10);
            ctx.lineTo(-15, 0);
            ctx.lineTo(-30, 10);
            ctx.closePath();
            ctx.fill();

            // Estructura de la cabeza de serpiente emplumada
            ctx.fillStyle = '#003b1f';
            ctx.strokeStyle = '#ffd700';
            ctx.lineWidth = 2;

            ctx.beginPath();
            ctx.moveTo(30, 0);
            ctx.lineTo(12, -14);
            ctx.lineTo(-15, -12);
            ctx.lineTo(-22, 0);
            ctx.lineTo(-15, 12);
            ctx.lineTo(12, 14);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Cresta superior dorada
            ctx.fillStyle = '#ffaa00';
            ctx.beginPath();
            ctx.moveTo(18, -8);
            ctx.lineTo(5, -15);
            ctx.lineTo(-2, -10);
            ctx.fill();

            // Ojos ardientes con brillo estelar
            ctx.fillStyle = '#ff3300';
            ctx.beginPath();
            ctx.arc(10, -5, 4, 0, Math.PI * 2);
            ctx.arc(10, 5, 4, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(11, -5, 1.5, 0, Math.PI * 2);
            ctx.arc(11, 5, 1.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
